<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        table {
            border-collapse: collapse;
            background-color: #fff;
            margin: 30px;
        }

        td {
            width: 50px;
            height: 50px;
            text-align: center;
            border: 3px solid black;
            font-size: 18px;
        }

        .red {
            background-color: rgb(74, 47, 168);
            color: rgb(243, 236, 236);
        }
    </style>
</head>

<body>

    <div id="table-container"></div>

    <script src="index.js">const container = document.getElementById("table-container");

const table = document.createElement("table");

for (let row = 1; row <= 5; row++) {
    const tr = document.createElement("tr")

    for (let col = 1; col <= 5; col++) {
        const td = document.createElement("td");

        if (col === row) {
            td.classList.add("red");
        }

        tr.appendChild(td);
    }

    table.appendChild(tr);
}

container.appendChild(table);</script>
</body>

</html>
